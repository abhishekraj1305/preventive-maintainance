[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["maintenance/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
exclude = ["maintenance/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/browser_smoke.py" = ["E402"]
